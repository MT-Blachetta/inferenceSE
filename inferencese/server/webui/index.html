<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inferenceSE</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1c1b19;--muted:#6d6a63;--line:#dedbd3;--accent:#0b6e5f;--user:#e7f1ee;--think:#f3f0e7}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--panel:#1f1f1c;--ink:#ecebe6;--muted:#9a978e;--line:#34332e;--accent:#4fc3ad;--user:#1d2e2a;--think:#26251f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100dvh}
header{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .meta{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
main{flex:1;overflow-y:auto;padding:16px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{background:var(--user);align-self:flex-end;max-width:85%}
.msg .role{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
details.think{background:var(--think);border-radius:8px;padding:6px 10px;margin-bottom:8px;color:var(--muted);font-size:14px}
details.think summary{cursor:pointer}
.empty{color:var(--muted);text-align:center;margin-top:18vh}
footer{border-top:1px solid var(--line);background:var(--panel);padding:10px 16px}
.row{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;resize:none;min-height:42px;max-height:40vh}
.opts{max-width:820px;margin:6px auto 0;display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}
.opts input{width:74px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
#status{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1>inferenceSE</h1>
  <div class="meta" id="meta">connecting…</div>
  <button id="stats">Memory</button>
  <button id="clear">New chat</button>
</header>
<main><div class="wrap" id="log"><div class="empty" id="empty">The model is streamed from the SSD. Long answers take time; tokens appear as they are produced.</div></div></main>
<footer>
  <div class="row">
    <textarea id="input" rows="1" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="primary" id="send">Send</button>
  </div>
  <div class="opts">
    <label>max tokens <input id="max" type="number" value="256" min="1"></label>
    <label>temperature <input id="temp" type="number" step="0.1" min="0" placeholder="default"></label>
    <label>system <input id="system" style="width:220px" placeholder="optional system prompt"></label>
    <span id="status"></span>
  </div>
</footer>
<script>
const $ = id => document.getElementById(id);
let messages = [], busy = false, controller = null;

// Optional API key (server started with --api-key): asked for once, kept in this browser.
function apiKey() { try { return localStorage.getItem("isse-key") || ""; } catch { return ""; } }
async function api(path, opts = {}, retry = true) {
  const headers = Object.assign({"Content-Type": "application/json"}, opts.headers || {});
  if (apiKey()) headers.Authorization = "Bearer " + apiKey();
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if (res.status === 401 && retry) {
    const k = prompt("This server needs an API key:");
    if (k) { try { localStorage.setItem("isse-key", k.trim()); } catch {} return api(path, opts, false); }
  }
  return res;
}

function bubble(role) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  const r = document.createElement("div"); r.className = "role"; r.textContent = role;
  const body = document.createElement("div");
  el.append(r, body); $("log").append(el);
  el.scrollIntoView({block: "end"});
  return {el, body};
}

async function send() {
  const text = $("input").value.trim();
  if (busy) { controller?.abort(); return; }
  if (!text) return;
  $("input").value = ""; autosize();
  bubble("user").body.textContent = text;
  messages.push({role: "user", content: text});
  const out = bubble("assistant");
  let think = null, content = "", reasoning = "", n = 0;
  const t0 = performance.now();
  busy = true; $("send").textContent = "Stop"; controller = new AbortController();
  const sys = $("system").value.trim();
  const body = {messages: (sys ? [{role: "system", content: sys}] : []).concat(messages),
                stream: true, max_tokens: +$("max").value || 256};
  if ($("temp").value !== "") body.temperature = +$("temp").value;
  $("status").textContent = "reading prompt…";
  try {
    const res = await api("/v1/chat/completions", {method: "POST", signal: controller.signal,
      body: JSON.stringify(body)});
    if (!res.ok) throw new Error((await res.json()).error?.message || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        const d = JSON.parse(data).choices?.[0]?.delta || {};
        if (d.reasoning_content) {
          if (!think) {
            think = document.createElement("details"); think.className = "think"; think.open = true;
            const s = document.createElement("summary"); s.textContent = "Reasoning";
            think.append(s, document.createElement("div")); out.el.insertBefore(think, out.body);
          }
          reasoning += d.reasoning_content; think.lastChild.textContent = reasoning; n++;
        }
        if (d.content) { if (think) think.open = false; content += d.content; out.body.textContent = content; n++; }
        const s = (performance.now() - t0) / 1000;
        $("status").textContent = `${n} chunks · ${s.toFixed(1)} s`;
        out.el.scrollIntoView({block: "end"});
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") out.body.textContent = content + "\n[error: " + e.message + "]";
  }
  const reply = {role: "assistant", content};
  if (reasoning) reply.reasoning_content = reasoning;      // Kimi expects its reasoning back
  messages.push(reply);
  busy = false; $("send").textContent = "Send"; controller = null;
}

function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, innerHeight * .4) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("send").onclick = send;
$("clear").onclick = async () => { if (busy) return; messages = []; $("log").innerHTML = ""; await api("/reset", {method: "POST", body: "{}"}); $("status").textContent = ""; };
$("stats").onclick = async () => {
  const s = await (await api("/metrics")).json(), m = s.memory, g = x => (x / 2 ** 30).toFixed(1) + " GiB";
  const b = bubble("memory");
  b.body.textContent = `virtual address space ${g(m.virtual_bytes)} in ${m.blocks} blocks\n` +
    `VRAM cache ${g(m.gpu.used)} / ${g(m.gpu.capacity)}   RAM cache ${g(m.ram.used)} / ${g(m.ram.capacity)}\n` +
    `SSD read ${g(m.ssd.bytes_read)} in ${m.ssd.reads} requests, swap ${g(m.ssd.swap_bytes)}\n` +
    `cache hit rate ${m.hit_rate ?? "–"}   policy ${m.policy}\n` +
    `context ${s.context_tokens} tokens   prefill ${s.timing.prefill_tok_per_s ?? "–"} tok/s   decode ${s.timing.decode_tok_per_s ?? "–"} tok/s`;
};
api("/props").then(r => r.json()).then(p => { $("meta").textContent = `${p.model || p.profile} · profile ${p.profile}`; document.title = `${p.profile} · inferenceSE`; })
  .catch(() => { $("meta").textContent = "server unreachable"; });
</script>
</body>
</html>
